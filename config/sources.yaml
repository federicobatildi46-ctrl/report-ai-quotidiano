# Fonti del report, raggruppate per sezione. Campi comuni:
#   id         identificativo unico (non cambiarlo: è la chiave della memoria in data/seen.json)
#   name       nome leggibile
#   type       rss | atom | github_releases | sitemap | sections | youtube | linkedin
#              | github_search | github_trending | hackernews
#   exclude_title  regex: titoli scartati subito (articoli SEO, promo…)
#   subsection sottosezione nel report ("auto" = la decide Claude)
#   official   true = fonte primaria dell'azienda (badge "Ufficiale")
#   max_items  tetto di elementi nuovi per giorno (default 12)
# Verificate l'11/11/2026.

claude:
  - id: claude-code-releases
    name: Claude Code — release
    type: github_releases
    url: https://github.com/anthropics/claude-code/releases.atom
    changelog_url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    subsection: code
    official: true
  - id: anthropic-site
    name: Anthropic — news, research, engineering
    type: sitemap          # anthropic.com non ha RSS: la sitemap ha le date
    url: https://www.anthropic.com/sitemap.xml
    # tutto il sito: i lanci dei modelli stanno nella radice (es. /claude-fable-and-mythos-5-2)
    include: ["anthropic.com/"]
    exclude: ["/legal", "/careers", "/events", "/news/announcements", "/research/team/",
              "/company", "/jobs"]
    subsection: auto
    official: true
  - id: claude-com-site
    name: Claude.com — articoli e pagine prodotto
    type: sitemap          # nessuna data nella sitemap: le novità sono gli URL nuovi
    url: https://claude.com/sitemap.xml
    include: ["https://claude.com/resources/articles/", "https://claude.com/product/",
              "https://claude.com/solutions/"]
    subsection: auto
    official: true
  - id: claude-blog
    name: Claude — blog
    type: sitemap          # claude.com/blog ora vive su claude.dev
    url: https://claude.dev/sitemap.xml
    include: ["/blog/"]
    subsection: auto
    official: true
  - id: claude-apps-release-notes
    name: Claude app — release notes
    type: sections
    url: https://support.claude.com/en/articles/12138966-release-notes
    heading: h3
    subsection: auto       # chat / cowork / design / code: decide Claude
    official: true
  - id: claude-platform-release-notes
    name: Claude Platform — release notes
    type: sections
    url: https://platform.claude.com/docs/en/release-notes/overview
    heading: h3
    subsection: ecosistema
    official: true
  - id: anthropic-skills-repo
    name: anthropics/skills — commit
    type: atom
    kind: commit
    url: https://github.com/anthropics/skills/commits/main.atom
    subsection: ecosistema
    official: true
    max_items: 8
  - id: agent-sdk-python
    name: Claude Agent SDK (Python) — release
    type: github_releases
    url: https://github.com/anthropics/claude-agent-sdk-python/releases.atom
    changelog_url: https://raw.githubusercontent.com/anthropics/claude-agent-sdk-python/main/CHANGELOG.md
    subsection: ecosistema
    official: true
  - id: claude-status
    name: Claude status — incidenti
    type: rss
    kind: incident
    url: https://status.claude.com/history.rss
    subsection: ecosistema
    official: true

higgsfield:
  - id: higgsfield-changelog
    name: Higgsfield — What's new
    type: sections
    url: https://higgsfield.ai/creator-hub/changelog
    heading: h2
    official: true
  - id: higgsfield-blog
    name: Higgsfield — blog
    type: sitemap
    url: https://higgsfield.ai/blog/sitemap.xml
    include: ["/blog/"]
    # articoli SEO/promo scartati subito: "9 Best…", "X vs Y", "Alternatives", saldi
    exclude_title: '^\d+\s+(best|top)\b|\bbest\b.*\b20\d\d\b|\bvs\.?\b|alternatives|deals?\b|% off'
    official: true
  - id: higgsfield-apps
    name: Higgsfield — nuove app
    type: sitemap
    url: https://higgsfield.ai/apps/sitemap.xml
    include: ["/apps/"]
    official: true

elevenlabs:
  - id: elevenlabs-blog
    name: ElevenLabs — blog
    type: rss
    url: https://elevenlabs.io/blog/rss.xml
    exclude_title: '^what is\b|\bvs\.?\b|how to choose'   # glossario SEO
    official: true
  - id: elevenlabs-changelog
    name: ElevenLabs — changelog
    type: rss
    kind: changelog
    url: https://elevenlabs.io/docs/changelog.rss
    official: true

creators:
