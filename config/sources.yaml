github:
  - id: gh-search
    name: GitHub — nuove repo per le aree dell'agenzia
    type: github_search
    created_within_days: 7   # repo nate negli ultimi 7 giorni che stanno prendendo stelle
    min_stars: 25
    max_per_area: 4
    queries:
      claude:      ["topic:claude-code created:>{since}", "topic:claude-skills created:>{since}",
                    "topic:mcp-server created:>{since}", "claude skill in:name,description created:>{since}"]
      siti_seo:    ["seo ai in:name,description created:>{since}",
                    "website builder ai agent in:name,description created:>{since}"]
      design_web:  ["design system claude in:name,description created:>{since}",
                    "figma mcp in:name,description created:>{since}"]
      social:      ["social media ai agent in:name,description created:>{since}",
                    "content creator ai in:name,description created:>{since}",
                    "linkedin ai in:name,description created:>{since}"]
      video:       ["video editing ai in:name,description created:>{since}", "topic:remotion created:>{since}",
                    "carousel generator in:name,description created:>{since}"]
      agenti:      ["voice agent in:name,description created:>{since}", "topic:ai-agents created:>{since}",
                    "elevenlabs in:name,description created:>{since}"]
      automazioni: ["topic:n8n created:>{since}", "workflow automation ai agent in:name,description created:>{since}",
                    "claude code github actions in:name,description created:>{since}"]
  - id: gh-trending
    name: GitHub Trending (giornaliero)
    type: github_trending
    url: https://github.com/trending?since=daily
    max_items: 15
  - id: hn-claude
    name: Hacker News — storie su Claude (≥100 punti)
    type: hackernews       # API Algolia ufficiale (hnrss.org era instabile)
    url: https://hn.algolia.com/api/v1/search_by_date?query=claude&tags=story&hitsPerPage=1
    query: claude
    min_points: 100
  - id: simonwillison
    name: Simon Willison (curatore affidabile su LLM e tool)
    type: atom
    url: https://simonwillison.net/atom/everything/

# Profilo personale: usato SOLO per imparare lo stile di scrittura (Fase 7), non nel report.
