# Fonti del report. Ogni fonte ha:
#   id        identificativo unico
#   section   claude | higgsfield | elevenlabs | creators | github
#   type      rss | atom | html | raw | youtube | github_api | apify
#   official  true = fonte primaria dell'azienda (badge "Ufficiale")
# Verificate l'11/11/2026 (stato HTTP 200).

claude:
  - id: claude-code-releases
    name: Claude Code — release GitHub
    type: atom
    url: https://github.com/anthropics/claude-code/releases.atom
    subsection: code
    official: true
  - id: claude-code-changelog
    name: Claude Code — CHANGELOG
    type: raw
    url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    subsection: code
    official: true
  - id: anthropic-news
    name: Anthropic — News
    type: html
    url: https://www.anthropic.com/news
    link_pattern: "/news/"
    subsection: ecosistema
    official: true
  - id: anthropic-engineering
    name: Anthropic — Engineering blog
    type: html
    url: https://www.anthropic.com/engineering
    link_pattern: "/engineering/"
    subsection: ecosistema
    official: true
  - id: claude-blog
    name: Claude — Blog
    type: html
    url: https://claude.com/blog
    link_pattern: "/blog/"
    subsection: auto   # Claude decide: code / cowork / chat / design / ecosistema
    official: true
  - id: claude-apps-release-notes
    name: Claude app — release notes
    type: html
    url: https://support.claude.com/en/articles/12138966-release-notes
    subsection: chat
    official: true
  - id: claude-api-release-notes
    name: Claude API — release notes
    type: html
    url: https://docs.claude.com/en/release-notes/api
    subsection: ecosistema
    official: true
  - id: anthropic-skills-repo
    name: anthropics/skills — commit
    type: atom
    url: https://github.com/anthropics/skills/commits/main.atom
    subsection: ecosistema
    official: true
  - id: agent-sdk-python
    name: Claude Agent SDK (Python) — release
    type: atom
    url: https://github.com/anthropics/claude-agent-sdk-python/releases.atom
    subsection: ecosistema
    official: true
  - id: claude-status
    name: Claude status — incidenti
    type: rss
    url: https://status.claude.com/history.rss
    subsection: ecosistema
    official: true
    only_major: true   # solo incidenti rilevanti, non ogni blip

higgsfield:
  - id: higgsfield-blog
