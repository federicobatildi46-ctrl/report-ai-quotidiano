# Interessi, sezioni e regole anti-rumore. Questo file guida il filtro di Claude.

report:
  title: "Report automatico notizie e aggiornamenti AI"
  language: it
  max_reading_minutes: 15        # tetto totale di lettura (~32 notizie)
  max_stories: 32                # tetto totale di notizie nel report
  lookback_hours: 26             # finestra di raccolta (24h + margine)
  model: sonnet                  # modello per il report quotidiano (risparmia quota del Pro)

linkedin:
  api_version: "202610"          # versione API LinkedIn (supportate ~1 anno: aggiornala ogni tanto)

generators:                      # pulsanti dell'app locale (Lezione, Post, Short)
  model: sonnet                  # "opus" per testi migliori, a costo di più quota
  max_sources: 4                 # fonti scaricate per ogni generazione
  images:                        # immagini dei post (CLI Higgsfield, ~0,12 crediti l'una)
    model: text2image_soul_v2    # Higgsfield Soul 2.0
    soul_name: Federico Finale   # i tuoi Soul: `higgsfield soul-id list`
    soul_id: bad6d27f-f6d0-478c-82e3-b8ccd53ebef7
    aspect_ratio: "3:4"          # il più vicino al 4:5 verticale di LinkedIn
    quality: 2k
    variants: 2                  # varianti per click

# Chi sono: serve a Claude per scrivere il "Perché ti serve" di ogni notizia.
profile: >
  Sto studiando l'AI per diventare creator e poi aprire un'agenzia AI per imprenditori e
  professionisti. Servizi futuri: siti web e SEO, social e personal brand (video, caroselli,
  post per Instagram, TikTok, Facebook, YouTube, LinkedIn), ads a pagamento, agenti AI
  (anche vocali) e automazioni con routine nel cloud. Uso Claude Code ogni giorno.
  Mi servono notizie che posso imparare, applicare a un cliente o trasformare in contenuto.

# A chi parlo: usato per scegliere "il post del giorno" e "lo Short del giorno" e per scriverli.
audience:
  linkedin: >
    Liberi professionisti e imprenditori italiani. Due profili: (1) titolari di piccole attività
    con dipendenti, da 10 a un massimo di 20 persone (studi professionali, agenzie, artigiani
    strutturati, e-commerce, servizi B2B locali); (2) liberi professionisti che si gestiscono il
    lavoro da soli. Non sono tecnici. Cercano automazioni, agenti AI o sistemi fatti con Claude
    Code per semplificare il lavoro, abbassare i costi, lavorare meno ore o produrre di più.
    Decidono in base a tempo e soldi risparmiati, non alla tecnologia. Diffidano dell'hype.
  shorts: >
    Persone che lavorano (non professionisti tech) e mi seguono per le novità AI e per strumenti
    fighi da usare subito nel lavoro e nei progetti personali: repo, skill, connettori, app.
    Vogliono vedere il risultato, capire come provarlo e ricevere il link.

# max_items: tetto di notizie per sezione (meglio 2 notizie vere che 10 riempitivi)
sections:
  - id: claude
    title: "Universo Claude"
    max_items: 8
    subsections:
      code:       "Claude Code"
      cowork:     "Cowork"
      chat:       "Chat (app claude.ai)"
      design:     "Claude Design"
      ecosistema: "Ecosistema a 360° — modelli, API, SDK, azienda"
  - id: higgsfield
    title: "Higgsfield"
    max_items: 4
    focus: "nuove funzioni e modelli, e come applicarli in pratica"
  - id: elevenlabs
    title: "ElevenLabs"
    max_items: 4
    focus: "prodotto, API, nuove voci/modelli, agenti vocali, casi d'uso"
  - id: creators
    title: "Dai creator che seguo"
    max_items: 6
    focus: "il contenuto e l'idea utile del video/post, non il titolo clickbait"
    include_shorts: true          # gli Shorts: 1–2 righe, salvo idee davvero nuove
  - id: github
    title: "GitHub: repo e skill per la mia agenzia"
    max_items: 8
    focus: "skill, MCP server, plugin e tool da dare a Claude, applicabili ai servizi dell'agenzia"
    subsections:
      claude:       "Skill e tool per Claude"
      siti_seo:     "Siti web e SEO"
      design_web:   "Design per siti e social"
      social:       "Social e contenuti (IG, TikTok, FB, YouTube, LinkedIn)"
      video:        "Video editing e caroselli"
      agenti:       "Agenti AI e agenti vocali"
      automazioni:  "Automazioni e routine cloud"
      curatori:     "Dai curatori (Hacker News, Simon Willison)"
  - id: virali
    title: "Da provare: repo, skill e tool virali (idee per gli Shorts)"
    max_items: 6
    focus: >-
      strumenti con effetto "wow" che chiunque può provare subito, gratis o con prova gratuita:
      repo GitHub, skill/plugin per Claude, connettori MCP, app AI. Pubblico: persone che lavorano
      e vogliono strumenti fighi per lavoro e progetti, non sviluppatori esperti
    subsections:
      repo:       "Repo GitHub"
      skill:      "Skill e plugin per Claude"
      connettori: "Connettori e MCP"
      app:        "App e tool AI"

# Cosa SEMPRE tenere
signal:
  - nuovi modelli, nuove funzioni, cambi di prezzo o di limiti
  - breaking change e deprecazioni
  - nuove skill / plugin / MCP / integrazioni utilizzabili subito
  - casi d'uso concreti con risultati misurabili
  - incidenti o problemi che impattano il mio lavoro

# Cosa SEMPRE scartare
noise:
  - annunci di partnership/clienti senza novità di prodotto per me
  - articoli SEO, listicle, "top 10 tool", contenuti promozionali
  - bugfix minori e release solo di manutenzione (raggruppare in 1 riga se servono)
  - repo con poche stelle, senza README chiaro, o duplicati di altre
  - repo fuori tema per l'agenzia (giochi, emulatori, progetti personali senza riuso)
  - video/post che ripetono una notizia già coperta da fonte ufficiale (citarli solo come conferma)
  - hype senza contenuto ("questo cambia TUTTO")
  - lamentele, opinioni, domande o voci senza dettagli prese da forum e social
  - notizie societarie minori (round, accordi commerciali); quelle grandi (es. IPO di Anthropic) sì, ma brevi
