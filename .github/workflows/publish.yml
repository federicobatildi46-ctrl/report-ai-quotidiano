# Pubblica su LinkedIn i post programmati dall'app (outputs/linkedin/coda.json).
# Gira ogni 30 minuti dalle 06:05 alle 21:35 UTC (≈ 7–23 in Italia): un post programmato esce al
# massimo ~30-40 minuti dopo l'orario scelto. Se la coda è vuota finisce in pochi secondi.

name: Pubblica post programmati

on:
  schedule:
    - cron: "5,35 6-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ci sono post da pubblicare?
        id: due
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          p = "outputs/linkedin/coda.json"
          due = 0
          if os.path.exists(p):
              now = datetime.now(timezone.utc)
              due = sum(1 for e in json.load(open(p, encoding="utf-8"))
                        if e["status"] == "programmato" and datetime.fromisoformat(e["publish_at"]) <= now)
          print(f"count={due}")
          EOF

      - uses: astral-sh/setup-uv@v6
        if: steps.due.outputs.count != '0'

      - name: Pubblica
        if: steps.due.outputs.count != '0'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          uv sync --frozen
          uv run digest publish-due

      - name: Salva lo stato della coda
        if: always() && steps.due.outputs.count != '0'
        run: |
          git config user.name "report-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/linkedin/coda.json
          if ! git diff --cached --quiet; then
            git commit -m "LinkedIn: aggiornata coda pubblicazioni"
            git pull --rebase
            git push
          fi
