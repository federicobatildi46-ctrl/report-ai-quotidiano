# Report AI quotidiano: gira ogni mattina sui server di GitHub (gratis), anche col PC spento.
# Raccoglie le fonti, Claude (abbonamento Pro) scrive il report, lo invia su Gmail e salva
# report + memoria nel repo. Se qualcosa va storto GitHub ti manda un'email di errore.
#
# Affidabilità: la "sveglia" interna di GitHub (schedule) è best-effort e su questo repo parte con
# 7-8 ore di ritardo (13-16/11/2026: impostata alle 04:23 UTC, partita tra le 11:37 e le 12:57).
# Per questo l'orario NON dipende più da lei. A svegliare il workflow sono, in ordine:
#  1. una routine Claude nel cloud (06:30 e 07:30 italiane d'inverno) che fa un push su un ramo
#     claude/... con un file in sveglia/ → evento "push" qui sotto, che parte subito;
#  2. l'app sul PC, che ogni 10 minuti controlla e lancia "workflow_dispatch" se il report manca;
#  3. lo schedule di GitHub, solo come ultima riserva.
# Se il report di oggi è già su GitHub ogni tentativo in più si ferma in pochi secondi.

name: Report AI quotidiano

on:
  push:                # la sveglia esterna (routine Claude): parte subito, senza code
    branches: ["claude/**"]
    paths: ["sveglia/**"]
  schedule:
    # UTC. GitHub fa partire questi orari con 5-8 ore di ritardo (misurato dal 12 al 16/11/2026).
    # Quelli della sera prima "atterrano" quindi tra le 04 e le 08 UTC (05-09 italiane): il primo
    # che parte dentro la finestra utile fa il report, gli altri si fermano in pochi secondi.
    - cron: "23 20 * * *"
    - cron: "23 21 * * *"
    - cron: "23 22 * * *"
    - cron: "23 23 * * *"
    - cron: "23 0 * * *"
    # Questi coprono il caso in cui GitHub torni puntuale (05:23, 06:53, 08:23 italiane d'inverno).
    - cron: "23 4 * * *"
    - cron: "53 5 * * *"
    - cron: "23 7 * * *"
  workflow_dispatch:   # pulsante "Run workflow" per lanciarlo a mano
    inputs:
      no_send:
        description: "Non inviare l'email (solo prova)"
        type: boolean
        default: false
      forza:
        description: "Rifai il report anche se quello di oggi esiste già"
        type: boolean
        default: false

permissions:
  contents: write      # per salvare report e memoria nel repo

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # si lavora sempre su main, anche se la sveglia arriva da un ramo claude/...

      - name: Il report di oggi c'è già?
        id: today
        env:
          FORZA: ${{ inputs.forza == true }}
        run: |
          echo "Avviato da: ${GITHUB_EVENT_NAME} (${GITHUB_REF_NAME}) alle $(date -u +%H:%M) UTC"
          # Finestra utile per gli avvii automatici: 03:45-20:00 UTC (dalle 04:45 italiane).
          # Un cron della sera partito troppo presto si ferma: ci pensa il successivo.
          now=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && { [ "$now" -lt 225 ] || [ "$now" -ge 1200 ]; }; then
            echo "Troppo presto (fuori dalla finestra 03:45-20:00 UTC): mi fermo."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # controlla l'ultima versione su GitHub (un tentativo precedente può averlo appena salvato)
          git fetch -q origin main
          if [ "$FORZA" != "true" ] && git cat-file -e "origin/main:reports/$(date -u +%Y-%m-%d).json" 2>/dev/null; then
            echo "Il report di oggi è già stato fatto: mi fermo."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git merge -q --ff-only origin/main || true
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.today.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.today.outputs.skip == 'false'
        with:
          node-version: "22"

      - name: Installa Claude Code
        if: steps.today.outputs.skip == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Installa dipendenze Python
        if: steps.today.outputs.skip == 'false'
        run: uv sync --frozen

      - name: Raccolta, report e invio
        if: steps.today.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run digest daily ${{ inputs.no_send && '--no-send' || '' }}

      - name: Conserva i dati grezzi (7 giorni, per capire eventuali problemi)
        if: always() && steps.today.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: raccolta-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salva report e memoria nel repo
        if: steps.today.outputs.skip == 'false'
        run: |
          git config user.name "report-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/seen.json
          for f in data/preferenze_stato.json config/preferenze.md; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Report $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Rimuove il ramo usato come sveglia
        if: always() && github.event_name == 'push'
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
