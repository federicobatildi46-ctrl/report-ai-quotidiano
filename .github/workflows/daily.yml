# Report AI quotidiano: gira ogni mattina sui server di GitHub (gratis), anche col PC spento.
# Raccoglie le fonti, Claude (abbonamento Pro) scrive il report, lo invia su Gmail e salva
# report + memoria nel repo. Se qualcosa va storto GitHub ti manda un'email di errore.

name: Report AI quotidiano

on:
  schedule:
    # 06:00 UTC = 07:00 in inverno, 08:00 in estate (ora italiana). GitHub può ritardare di
    # qualche minuto nelle ore di punta: il report è comunque pronto prima delle 9.
    - cron: "0 6 * * *"
  workflow_dispatch:   # pulsante "Run workflow" per lanciarlo a mano
    inputs:
      no_send:
        description: "Non inviare l'email (solo prova)"
        type: boolean
        default: false

permissions:
  contents: write      # per salvare report e memoria nel repo

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Installa dipendenze Python
        run: uv sync --frozen

      - name: Raccolta, report e invio
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run digest daily ${{ inputs.no_send && '--no-send' || '' }}

      - name: Salva report e memoria nel repo
        run: |
          git config user.name "report-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/seen.json
          if git diff --cached --quiet; then
            echo "Niente da salvare"
          else
            git commit -m "Report $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
