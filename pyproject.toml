[project]
name = "digest"
version = "0.1.0"
description = "Report AI quotidiano locale: raccolta, filtro, fact check e generatori di contenuti"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "truststore>=0.9",
]

[tool.uv]
# Su questo PC l'HTTPS passa da un certificato di sistema (antivirus): usa quelli di Windows.
system-certs = true

[project.scripts]
digest = "digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest"]
